name: techniview-runner

services:
  go-judge:
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/go-judge:${IMAGE_TAG:?Set IMAGE_TAG}
    ports:
      - "${RUNNER_PRIVATE_BIND_IP:?Set RUNNER_PRIVATE_BIND_IP}:5050:5050"
    environment:
      GO_JUDGE_PARALLELISM: ${GO_JUDGE_PARALLELISM:-16}
    privileged: true
    cgroup: private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: [CMD, /opt/python/bin/python3.14, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${RUNNER_CPU_LIMIT:-8}"
          memory: ${JUDGE_WORKER_MEMORY_LIMIT:-8G}
