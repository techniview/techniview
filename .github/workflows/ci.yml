name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: ./scripts/ci/lint-workflows.sh

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.18'
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv export --locked --no-default-groups --no-emit-project --format requirements.txt --no-header --output-file /tmp/backend-requirements.lock && cmp backend/requirements.lock /tmp/backend-requirements.lock
      - run: uv run ruff check backend scripts/tests
      - run: uv run ruff format --check backend scripts/tests
      - run: uv run python -m pytest backend/tests -q --cov=backend/app --cov-branch --cov-report=term-missing
      - run: uv run pip-audit

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx prettier --check .
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  integration:
    name: MySQL and Judge0 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make integration
      - run: sudo apt-get update && sudo apt-get install --yes restic
      - run: python3 scripts/tests/test_backup_mysql.py

  production-images:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/ci/build-production-images.sh

  ci:
    name: CI
    if: ${{ always() }}
    needs: [workflows, backend, frontend, integration, production-images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        run: |
          test "${{ needs.workflows.result }}" = success
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.production-images.result }}" = success

  publish-production-images:
    name: Publish production images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and publish images by commit SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/publish-production-images.sh
