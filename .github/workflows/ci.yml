name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: ./scripts/ci/lint-workflows.sh

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.18'
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv export --locked --no-default-groups --no-emit-project --format requirements.txt --no-header --output-file /tmp/backend-requirements.lock && cmp backend/requirements.lock /tmp/backend-requirements.lock
      - run: uv run ruff check backend scripts/tests scripts/performance
      - run: uv run ruff format --check backend scripts/tests scripts/performance
      - run: uv run python -m pytest backend/tests -q --cov=backend/app --cov-branch --cov-report=term-missing
      - run: uv run pip-audit

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx prettier --check .
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  integration:
    name: MySQL and go-judge integration
    # Pin the load-test host image so the CI baseline doesn't drift with `latest`.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make integration
      - name: Record load-test runner profile
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_OS $RUNNER_ARCH)"
          lscpu
          free -h
          docker version
      - run: make load-test
      - name: Install pinned restic version
        run: |
          set -euo pipefail
          version=0.19.1
          archive="restic_${version}_linux_amd64.bz2"
          temporary_directory=$(mktemp -d)
          trap 'rm -rf "$temporary_directory"' EXIT
          curl --fail --silent --show-error --location \
            "https://github.com/restic/restic/releases/download/v${version}/${archive}" \
            --output "${temporary_directory}/${archive}"
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  ${temporary_directory}/${archive}" \
            | sha256sum --check --status
          bunzip2 --decompress --stdout "${temporary_directory}/${archive}" \
            > "${temporary_directory}/restic"
          sudo install -m 0755 "${temporary_directory}/restic" /usr/local/bin/restic
          restic version
      - run: python3 scripts/tests/test_backup_mysql.py

  performance-regression:
    name: Performance regression comparison
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select comparison revisions
        id: revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "$zero_sha" ]] || \
            ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            BASE_SHA=$(git merge-base origin/main "$GITHUB_SHA" || true)
          fi
          if [[ -z "$BASE_SHA" ]]; then
            echo "Could not find a comparison base for $GITHUB_SHA" >&2
            exit 1
          fi
          git worktree add --detach /tmp/techniview-perf-base "$BASE_SHA"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "proposed=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Compare fixed performance workloads
        run: |
          PYTHONPATH=backend python3 scripts/performance/compare_load_test.py \
            --base-path /tmp/techniview-perf-base \
            --base-commit '${{ steps.revisions.outputs.base }}' \
            --proposed-commit '${{ steps.revisions.outputs.proposed }}' \
            --output-dir "$RUNNER_TEMP/performance-artifacts"
      - name: Upload base and proposed reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/performance-artifacts
          if-no-files-found: warn
          retention-days: 30

  production-images:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/ci/build-production-images.sh

  ci:
    name: CI
    if: ${{ always() }}
    needs: [workflows, backend, frontend, integration, performance-regression, production-images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        run: |
          test "${{ needs.workflows.result }}" = success
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.performance-regression.result }}" = success || test "${{ needs.performance-regression.result }}" = skipped
          test "${{ needs.production-images.result }}" = success

  publish-production-images:
    name: Publish production images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and publish images by commit SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/publish-production-images.sh
