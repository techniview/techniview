name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: ./scripts/ci/lint-workflows.sh

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.18'
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run python -m pytest backend/tests -q --cov=backend/app --cov-branch --cov-report=term-missing
      - run: uv run pip-audit

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx prettier --check .
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  integration:
    name: MySQL and Judge0 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make integration

  ci:
    name: CI
    if: ${{ always() }}
    needs: [workflows, backend, frontend, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        run: |
          test "${{ needs.workflows.result }}" = success
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.integration.result }}" = success
