name: Bake runner image

on:
  workflow_dispatch:

concurrency:
  group: bake-runner-image
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  bake:
    name: Bake and publish the go-judge runner image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to the container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Probe package write access
        run: |
          set -euo pipefail
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p /tmp/ghcr-probe
          printf 'FROM scratch\nCOPY flag.txt /flag.txt\n' > /tmp/ghcr-probe/Dockerfile
          echo turned > /tmp/ghcr-probe/flag.txt
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -t "$image_namespace/go-judge:probe-deleteme" --push /tmp/ghcr-probe
      - name: Build and push the runner image
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -t "$image_namespace/go-judge:runner-latest" \
            -t "$image_namespace/go-judge:runner-${RUN_NUMBER}" \
            --push ./go-judge
      - name: Verify the pushed image
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$image_namespace/go-judge:runner-${RUN_NUMBER}"
          docker pull --quiet "$image"
          ./scripts/ci/check-go-judge-image.sh "$image"
      - name: Pin the digest on main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest.Body}}' "$image_namespace/go-judge:runner-${RUN_NUMBER}")
          printf '%s\n' "$image_namespace/go-judge@$digest" > go-judge/runner-image.ref
          git config user.name "techniview-bake"
          git config user.email "techniview-bake@users.noreply.github.com"
          git add go-judge/runner-image.ref
          git commit -m "Pin the go-judge runner to $digest"
          git push origin HEAD:main
      - name: Record the bake outcome
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "baked and pushed $image_namespace/go-judge:runner-${RUN_NUMBER}"
            echo "pinned digest: $(cat go-judge/runner-image.ref)"
          } >> "$GITHUB_STEP_SUMMARY"
