name: Bake runner image

on:
  workflow_dispatch:

concurrency:
  group: bake-runner-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bake:
    name: Bake and publish the go-judge runner image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish the runner image
        run: |
          set -euo pipefail
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64 \
            --tag "$image_namespace/go-judge:runner-latest" \
            --tag "$image_namespace/go-judge:runner-${GITHUB_RUN_NUMBER}" \
            --push ./go-judge
      - name: Pull and verify the published image
        id: published
        run: |
          set -euo pipefail
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$image_namespace/go-judge:runner-${GITHUB_RUN_NUMBER}"
          docker pull "$image"
          ./scripts/ci/check-go-judge-image.sh "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record the bake outcome
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          echo "Published and verified $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Update go-judge/runner-image.ref to this digest in a reviewed PR." >> "$GITHUB_STEP_SUMMARY"
