name: techniview

x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  frontend:
    logging: *default-logging
    image: techniview-frontend:gpu
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    networks:
      - web
    read_only: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp
      - /data
      - /config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    logging: *default-logging
    image: techniview-backend:gpu
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment: &application_environment
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_DB: ${MYSQL_DB:?Set MYSQL_DB}
      GO_JUDGE_URL: http://go-judge:5050
      BIG_O_OLLAMA_URL: ${BIG_O_OLLAMA_URL:-}
      BIG_O_OLLAMA_MODEL: ${BIG_O_OLLAMA_MODEL:-qwen3.8:27b}
      BIG_O_OLLAMA_TIMEOUT_SECONDS: ${BIG_O_OLLAMA_TIMEOUT_SECONDS:-90}
      BIG_O_ANALYSIS_MAX_ATTEMPTS: ${BIG_O_ANALYSIS_MAX_ATTEMPTS:-3}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_COOKIE_PATH: /techniview
      API_ROOT_PATH: /techniview
      CORS_ORIGINS: https://${PUBLIC_HOST:?Set PUBLIC_HOST}
      PUBLIC_APP_URL: https://${PUBLIC_HOST:?Set PUBLIC_HOST}/techniview
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-resend}
      EMAIL_SIGNING_KEY_FILE: /run/secrets/email_signing_key
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      RESEND_API_KEY_FILE: ${RESEND_API_KEY_FILE:-/run/secrets/resend_api_key}
      DIRECT_WORKER_PROCESSES: ${DIRECT_WORKER_PROCESSES:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
    volumes:
      - app_secrets:/run/secrets:ro
    networks:
      - web
      - data
      - outbound
      - monitoring
      - runner_link
    read_only: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysql:
        condition: service_healthy
      go-judge:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      python -m scripts.import_problem_catalog data/problem_catalog.json &&
      exec uvicorn main:app --host 0.0.0.0 --port 8000
      --workers ${API_WORKERS:-2}
      --no-access-log --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  app_worker:
    logging: *default-logging
    image: techniview-backend:gpu
    environment:
      <<: *application_environment
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
    volumes:
      - app_secrets:/run/secrets:ro
      - captured_mail:/tmp/techniview-mail
    networks:
      - data
      - outbound
      - runner_link
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
      go-judge:
        condition: service_healthy
    command: python -m app.worker.direct_supervisor
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    deploy:
      replicas: ${APP_WORKER_REPLICAS:-4}
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  complexity_worker:
    logging: *default-logging
    image: techniview-backend:gpu
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_DB: ${MYSQL_DB:?Set MYSQL_DB}
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
      BIG_O_OLLAMA_URL: ${BIG_O_OLLAMA_URL:-}
      BIG_O_OLLAMA_MODEL: ${BIG_O_OLLAMA_MODEL:-qwen3.8:27b}
      BIG_O_OLLAMA_TIMEOUT_SECONDS: ${BIG_O_OLLAMA_TIMEOUT_SECONDS:-90}
      BIG_O_ANALYSIS_MAX_ATTEMPTS: ${BIG_O_ANALYSIS_MAX_ATTEMPTS:-3}
    volumes:
      - app_secrets:/run/secrets:ro
    networks:
      - data
      - outbound
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.worker.complexity
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    deploy:
      replicas: ${COMPLEXITY_WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  mysql:
    logging: *default-logging
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DB:?Set MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    volumes:
      - database_secrets:/run/secrets:ro
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD=$$(cat "$${MYSQL_PASSWORD_FILE:?}") && export MYSQL_PWD &&
          mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER"
          "$$MYSQL_DATABASE" --batch --skip-column-names -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  go-judge:
    logging: *default-logging
    image: ${GO_JUDGE_IMAGE:-ghcr.io/techniview/techniview/go-judge@sha256:d688e5ae23c443fc4da5b52fc39ffdc4b31d8dd0c0f9ce33e22afa39aff05c47}
    environment:
      GO_JUDGE_PARALLELISM: ${GO_JUDGE_PARALLELISM:-16}
    privileged: true
    cgroup: private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: [CMD, /opt/python/bin/python3.14, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${RUNNER_CPU_LIMIT:-24}"
          memory: ${JUDGE_WORKER_MEMORY_LIMIT:-8G}
    networks:
      - runner_link

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.3.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - prometheus_config:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  grafana:
    logging: *default-logging
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_provisioning:/etc/grafana/provisioning:ro
      - grafana_dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - grafana_access
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  app_secrets:
    external: true
    name: techniview_app_secrets
  database_secrets:
    external: true
    name: techniview_database_secrets
  prometheus_config:
    external: true
    name: techniview_prometheus_config
  grafana_provisioning:
    external: true
    name: techniview_grafana_provisioning
  grafana_dashboards:
    external: true
    name: techniview_grafana_dashboards
  captured_mail:

networks:
  web:
  data:
    internal: true
  outbound:
  monitoring:
    internal: true
  grafana_access:
  runner_link:
    name: techniview_runner_link
    internal: true
