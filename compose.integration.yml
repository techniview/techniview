name: techniview-integration

x-app: &app
  build:
    context: ./backend
    dockerfile: integration/Dockerfile
  environment: &app-environment
    DATABASE_URL: mysql+pymysql://integration:p%40ss%25word@mysql/integration
    GO_JUDGE_URL: http://go-judge:5050
    INTEGRATION_TESTS: "1"
    EMAIL_DELIVERY_MODE: capture
    EMAIL_SIGNING_KEY: techniview-integration-only-email-key-2026
    EMAIL_FROM: TechniView <noreply@example.test>
    DB_POOL_SIZE: "30"
    DB_MAX_OVERFLOW: "0"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: integration-root-only
      MYSQL_DATABASE: integration
      MYSQL_USER: integration
      MYSQL_PASSWORD: p@ss%word
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1]
      interval: 2s
      timeout: 2s
      retries: 60
  go-judge:
    build: ./go-judge
    image: techniview-go-judge:integration
    privileged: true
    cgroup: private
    init: true
    cpus: ${RUNNER_CPU_LIMIT:-4}
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      GO_JUDGE_PARALLELISM: ${GO_JUDGE_PARALLELISM:-4}
    healthcheck:
      test: [CMD, /opt/python/bin/python3.14, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:5050/version")']
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    <<: *app
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # mysqladmin ping over the socket can report healthy before TCP accepts
    # connections, so wait for a real TCP login before running migrations.
    command: sh -c 'i=0; while [ $$i -lt 60 ]; do python -c "import os,pymysql;from urllib.parse import urlparse,unquote;u=urlparse(os.environ[\"DATABASE_URL\"]);pymysql.connect(host=u.hostname,port=(u.port or 3306),user=unquote(u.username or \"\"),password=unquote(u.password or \"\"),database=u.path.lstrip(\"/\"),connect_timeout=2).close()" 2>/dev/null && break; i=$$((i+1)); echo "waiting for mysql ($$i)"; sleep 2; done; alembic upgrade head && python -m app.seed && uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/ping")']
      interval: 2s
      timeout: 3s
      retries: 60
  tests:
    <<: *app
    command: python -m pytest -v integration --override-ini=pythonpath=.
    depends_on:
      backend:
        condition: service_healthy
      go-judge:
        condition: service_healthy
      app_worker:
        condition: service_started
  app_worker:
    <<: *app
    environment:
      <<: *app-environment
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "0"
      DIRECT_WORKER_PROCESSES: ${DIRECT_WORKER_PROCESSES:-4}
    command: python -m app.worker.direct_supervisor
    depends_on:
      backend:
        condition: service_healthy
      go-judge:
        condition: service_healthy
