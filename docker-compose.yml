name: techniview

services:
  go-judge:
    build: ./go-judge
    image: techniview-go-judge:local
    ports:
      - "${GO_JUDGE_PORT:-5050}:5050"
    privileged: true
    cgroup: private
    init: true
    cpus: ${RUNNER_CPU_LIMIT:-24}
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      GO_JUDGE_PARALLELISM: ${GO_JUDGE_PARALLELISM:-16}
    healthcheck:
      test: [CMD, /opt/python/bin/python3.14, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:5050/version")']
      interval: 5s
      timeout: 3s
      retries: 30

  mysql:
    container_name: techniview-mysql
    image: mysql:8.0
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${MYSQL_DB:-app_db}
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    container_name: techniview-backend
    build: ./backend
    image: techniview-backend:local
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./:/workspace
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
      - MYSQL_DB=${MYSQL_DB:-app_db}
      - GO_JUDGE_URL=http://go-judge:5050
      - BIG_O_OLLAMA_URL=${BIG_O_OLLAMA_URL:-}
      - BIG_O_OLLAMA_MODEL=${BIG_O_OLLAMA_MODEL:-qwen3.8:27b}
      - BIG_O_OLLAMA_TIMEOUT_SECONDS=${BIG_O_OLLAMA_TIMEOUT_SECONDS:-90}
      - EMAIL_DELIVERY_MODE=${EMAIL_DELIVERY_MODE:-capture}
      - EMAIL_SIGNING_KEY=${EMAIL_SIGNING_KEY:-techniview-local-only-email-signing-key-2026}
      - EMAIL_FROM=${EMAIL_FROM:-TechniView <noreply@example.test>}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:5173}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEARCH_EXPORT_SECRET=${RESEARCH_EXPORT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      go-judge:
        condition: service_healthy
    command: bash -c "git -C /workspace config core.hooksPath .githooks 2>/dev/null || true; alembic upgrade head && python -m app.seed && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  app_worker:
    deploy:
      replicas: ${APP_WORKER_REPLICAS:-4}
    build: ./backend
    image: techniview-backend:local
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
      - MYSQL_DB=${MYSQL_DB:-app_db}
      - GO_JUDGE_URL=http://go-judge:5050
      - DIRECT_WORKER_PROCESSES=${DIRECT_WORKER_PROCESSES:-4}
      - BIG_O_OLLAMA_URL=${BIG_O_OLLAMA_URL:-}
      - BIG_O_OLLAMA_MODEL=${BIG_O_OLLAMA_MODEL:-qwen3.8:27b}
      - BIG_O_OLLAMA_TIMEOUT_SECONDS=${BIG_O_OLLAMA_TIMEOUT_SECONDS:-90}
      - EMAIL_DELIVERY_MODE=${EMAIL_DELIVERY_MODE:-capture}
      - EMAIL_SIGNING_KEY=${EMAIL_SIGNING_KEY:-techniview-local-only-email-signing-key-2026}
      - EMAIL_FROM=${EMAIL_FROM:-TechniView <noreply@example.test>}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:5173}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEARCH_EXPORT_SECRET=${RESEARCH_EXPORT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
      go-judge:
        condition: service_healthy
    command: python -m app.worker.direct_supervisor

  complexity_worker:
    build: ./backend
    image: techniview-backend:local
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
      - MYSQL_DB=${MYSQL_DB:-app_db}
      - BIG_O_OLLAMA_URL=${BIG_O_OLLAMA_URL:-}
      - BIG_O_OLLAMA_MODEL=${BIG_O_OLLAMA_MODEL:-qwen3.8:27b}
      - BIG_O_OLLAMA_TIMEOUT_SECONDS=${BIG_O_OLLAMA_TIMEOUT_SECONDS:-90}
      - BIG_O_ANALYSIS_MAX_ATTEMPTS=${BIG_O_ANALYSIS_MAX_ATTEMPTS:-3}
      - WORKER_LEASE_SECONDS=${WORKER_LEASE_SECONDS:-60}
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.worker.complexity

  frontend:
    container_name: techniview-frontend
    build: ./frontend
    image: techniview-frontend:local
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install --silent && npm run dev"
    depends_on:
      - backend

volumes:
  mysql_data:
