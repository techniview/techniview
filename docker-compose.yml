name: techniview

services:
  server:
    container_name: internal-judge0-fork-server
    build:
      context: ./internal-judge0-fork
      target: api
    image: internal-judge0-fork-api:local
    ports:
      - "${JUDGE0_PORT:-2358}:2358"
    command: /api/scripts/server
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test_password}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-test_password}
      - JUDGE0_POSTGRES_HOST=db
      - JUDGE0_POSTGRES_PORT=5432
      - JUDGE0_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - JUDGE0_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test_password}
      - JUDGE0_POSTGRES_DB=${POSTGRES_DB:-postgres}
      - JUDGE0_REDIS_HOST=redis
      - JUDGE0_REDIS_PORT=6379
      - JUDGE0_REDIS_PASSWORD=${REDIS_PASSWORD:-test_password}
    depends_on:
      - db
      - redis

  workers:
    container_name: internal-judge0-fork-workers
    build:
      context: ./internal-judge0-fork
      target: worker
    image: internal-judge0-fork-worker:local
    command: /api/scripts/workers
    cgroup: private
    init: true
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test_password}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-test_password}
      - JUDGE0_POSTGRES_HOST=db
      - JUDGE0_POSTGRES_PORT=5432
      - JUDGE0_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - JUDGE0_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test_password}
      - JUDGE0_POSTGRES_DB=${POSTGRES_DB:-postgres}
      - JUDGE0_REDIS_HOST=redis
      - JUDGE0_REDIS_PORT=6379
      - JUDGE0_REDIS_PASSWORD=${REDIS_PASSWORD:-test_password}
    privileged: true
    security_opt:
      - seccomp=unconfined
    depends_on:
      - db
      - redis
      - server

  db:
    container_name: techniview-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test_password}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: techniview-redis
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-test_password}
    volumes:
      - redis_data:/data

  mysql:
    container_name: techniview-mysql
    image: mysql:8.0
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${MYSQL_DB:-app_db}
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    container_name: techniview-backend
    build: ./backend
    image: techniview-backend:local
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./:/workspace
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
      - MYSQL_DB=${MYSQL_DB:-app_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test_password}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-test_password}
      - JUDGE0_URL=http://server:2358
      - BIG_O_OLLAMA_URL=${BIG_O_OLLAMA_URL:-}
      - BIG_O_OLLAMA_MODEL=${BIG_O_OLLAMA_MODEL:-qwen3.8:27b}
      - BIG_O_OLLAMA_TIMEOUT_SECONDS=${BIG_O_OLLAMA_TIMEOUT_SECONDS:-90}
      - JUDGE0_CALLBACK_BASE_URL=${JUDGE0_CALLBACK_BASE_URL:-http://backend:8000/api/internal/judge0/callbacks}
      - EMAIL_DELIVERY_MODE=${EMAIL_DELIVERY_MODE:-capture}
      - EMAIL_SIGNING_KEY=${EMAIL_SIGNING_KEY:-techniview-local-only-email-signing-key-2026}
      - EMAIL_FROM=${EMAIL_FROM:-TechniView <noreply@example.test>}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:5173}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEARCH_EXPORT_SECRET=${RESEARCH_EXPORT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_started
    command: bash -c "git -C /workspace config core.hooksPath .githooks 2>/dev/null || true; alembic upgrade head && python -m app.seed && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  app_worker:
    build: ./backend
    image: techniview-backend:local
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
      - MYSQL_DB=${MYSQL_DB:-app_db}
      - JUDGE0_URL=http://server:2358
      - BIG_O_OLLAMA_URL=${BIG_O_OLLAMA_URL:-}
      - BIG_O_OLLAMA_MODEL=${BIG_O_OLLAMA_MODEL:-qwen3.8:27b}
      - BIG_O_OLLAMA_TIMEOUT_SECONDS=${BIG_O_OLLAMA_TIMEOUT_SECONDS:-90}
      - JUDGE0_CALLBACK_BASE_URL=${JUDGE0_CALLBACK_BASE_URL:-http://backend:8000/api/internal/judge0/callbacks}
      - EMAIL_DELIVERY_MODE=${EMAIL_DELIVERY_MODE:-capture}
      - EMAIL_SIGNING_KEY=${EMAIL_SIGNING_KEY:-techniview-local-only-email-signing-key-2026}
      - EMAIL_FROM=${EMAIL_FROM:-TechniView <noreply@example.test>}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:5173}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEARCH_EXPORT_SECRET=${RESEARCH_EXPORT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
      server:
        condition: service_started
    command: python -m app.worker

  complexity_worker:
    build: ./backend
    image: techniview-backend:local
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
      - MYSQL_DB=${MYSQL_DB:-app_db}
      - BIG_O_OLLAMA_URL=${BIG_O_OLLAMA_URL:-}
      - BIG_O_OLLAMA_MODEL=${BIG_O_OLLAMA_MODEL:-qwen3.8:27b}
      - BIG_O_OLLAMA_TIMEOUT_SECONDS=${BIG_O_OLLAMA_TIMEOUT_SECONDS:-90}
      - BIG_O_ANALYSIS_MAX_ATTEMPTS=${BIG_O_ANALYSIS_MAX_ATTEMPTS:-3}
      - WORKER_LEASE_SECONDS=${WORKER_LEASE_SECONDS:-60}
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.worker.complexity

  frontend:
    container_name: techniview-frontend
    build: ./frontend
    image: techniview-frontend:local
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install --silent && npm run dev"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  mysql_data:
