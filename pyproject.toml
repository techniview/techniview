[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["__pycache__", ".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = ["-q", "--strict-markers", "--strict-config"]

[tool.pycodestyle]
max-line-length = 88

[tool.flake8]
max-line-length = 88
