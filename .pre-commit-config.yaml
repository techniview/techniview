repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check backend --fix
        language: system
        always_run: true
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: ruff format backend
        language: system
        always_run: true
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash -c 'cd backend && python -m pytest -q'
        language: system
        always_run: true
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        always_run: true
        pass_filenames: false
      - id: frontend-eslint
        name: frontend eslint
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        always_run: true
        pass_filenames: false
      - id: frontend-prettier
        name: frontend prettier
        entry: bash -c 'cd frontend && npx prettier --check .'
        language: system
        always_run: true
        pass_filenames: false
      - id: frontend-vitest
        name: frontend vitest
        entry: bash -c 'cd frontend && npm test'
        language: system
        always_run: true
        pass_filenames: false
